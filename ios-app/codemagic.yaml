# Codemagic builds this on a cloud Mac and uploads it to TestFlight.
# Set up once in Codemagic: connect the GitHub repo, add an App Store Connect
# API key under Teams > Integrations (name it exactly: Tenura App Store Connect).
workflows:
  tenura-testflight:
    name: Tenura iOS to TestFlight
    working_directory: ios-app
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Tenura App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.usetenura.app
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies and bundle the demo
        script: |
          npm install
          node build-www.js
      - name: Create the iOS project
        script: |
          npx cap add ios
          cp icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.usetenura.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build the .ipa
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
